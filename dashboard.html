<title>桌面仪表盘</title>
<style>
  :root {
    --bg: #0a0a0f;
    --fg: #e8e8f0;
    --acc: #378ADD;
    --dim: rgba(232,232,240,.5);
    --card: #1c1c24;
    --line: rgba(255,255,255,.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none;
    transition: background .5s ease, color .5s ease;
  }

  .dash { display:flex; flex-direction:column; width:100%; height:100%; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:2vh 4vw 0; }
  .brand { font-size:clamp(13px,3.6vmin,26px); letter-spacing:.22em; color:var(--dim); }
  .sem { display:flex; align-items:center; gap:12px; }
  .sem-txt { font-size:clamp(12px,3.2vmin,22px); color:var(--dim); letter-spacing:.08em; font-variant-numeric:tabular-nums; }
  .sem-bar { width:clamp(90px,16vw,200px); height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .sem-fill { display:block; height:100%; width:0; background:var(--acc); border-radius:3px; transition:width .6s ease; }
  .main { display:flex; flex:1; min-height:0; }
  .left { width:58%; display:flex; flex-direction:column; justify-content:flex-start; padding:1.5vh 3vw 2vh 4vw; gap:2.2vh; min-height:0; }
  .right { width:42%; display:flex; flex-direction:column; padding:1vh 4vw 3vh 1vw; gap:2.4vh; min-height:0; }
  .tipbar { display:flex; align-items:center; gap:10px; padding:1vh 4vw 1.6vh; font-size:clamp(13px,3.4vmin,24px); color:var(--fg); border-top:1px solid var(--line); background:rgba(255,255,255,.02); min-height:0; }
  .tip-ico { font-size:1.15em; flex:0 0 auto; }
  .tip-txt { font-weight:400; letter-spacing:.02em; line-height:1.3; }

  .timeblock { text-align:center; }

  /* 本周日历 */
  .week { display:flex; gap:8px; }
  .wd {
    flex:1; min-width:0; width:0; display:flex; flex-direction:column; align-items:center;
    padding:1.2vh 0; border-radius:14px; background:var(--card); border:1px solid var(--line);
    transition: background .3s ease, border-color .3s ease;
  }
  .wd .wl { font-size:clamp(14px,3.8vmin,30px); color:var(--dim); letter-spacing:.05em; }
  .wd .wn { font-size:clamp(20px,6vmin,52px); font-weight:500; margin-top:2px; font-variant-numeric:tabular-nums; }
  .wd.today { background:var(--acc); border-color:var(--acc); }
  .wd.today .wl { color:rgba(0,0,0,.55); }
  .wd.today .wn { color:#fff; font-weight:600; }
  .wd .note {
    font-size:clamp(12px,3.4vmin,26px); color:var(--dim); margin-top:4px;
    max-width:100%; padding:0 4px; line-height:1.25;
    word-break:break-all; overflow-wrap:anywhere; text-align:center;
  }
  .wd.today .note { color:rgba(255,255,255,.82); }

  /* 时间 */
  .time { display:flex; align-items:baseline; justify-content:center; line-height:1; font-variant-numeric:tabular-nums; }
  .time .hm { font-size:clamp(68px,32vh,360px); font-weight:600; letter-spacing:.01em; }
  .time .sec { font-size:clamp(24px,10vh,110px); font-weight:400; color:var(--acc); margin-left:.12em; transition:color .5s ease; }
  .date { font-size:clamp(14px,4.6vh,40px); font-weight:300; color:var(--dim); letter-spacing:.14em; margin-top:.6vh; transition:color .5s ease; }

  /* 右侧卡片 */
  .card { flex:1; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:2.4vh 2vw; display:flex; flex-direction:column; overflow:hidden; min-height:0; }
  .course-card { flex:0 0 auto; }
  .card-title { font-size:clamp(15px,4vmin,32px); color:var(--dim); letter-spacing:.18em; margin-bottom:1.4vh; display:flex; align-items:center; justify-content:space-between; }
  .card-title::after { content:""; flex:1; height:1px; background:var(--line); margin-left:14px; }
  .list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .row { display:flex; align-items:center; padding:1.1vh 0; border-bottom:1px solid var(--line); font-size:clamp(16px,4.2vmin,34px); }
  .row:last-child { border-bottom:none; }
  .row .t { color:var(--acc); font-variant-numeric:tabular-nums; margin-right:14px; white-space:nowrap; }
  .row .n { font-weight:400; }
  .row .room { margin-left:auto; color:var(--dim); font-size:.85em; white-space:nowrap; }
  .empty { color:var(--dim); font-size:clamp(15px,3.8vmin,30px); padding:2vh 0; text-align:center; }
  .todo-stat { margin-top:1vh; padding-top:1.2vh; border-top:1px solid var(--line); color:var(--dim); font-size:clamp(13px,3.2vmin,26px); text-align:right; }
  .todo-stat b { color:var(--acc); font-weight:600; }

  .todo { cursor:pointer; }
  .todo .box { width:1.1em; height:1.1em; border:1.5px solid var(--dim); border-radius:5px; margin-right:14px; flex:none; display:flex; align-items:center; justify-content:center; color:transparent; font-size:.8em; transition:all .2s ease; }
  .todo.done .box { background:var(--acc); border-color:var(--acc); color:#fff; }
  .todo.done .n { color:var(--dim); text-decoration:line-through; }

  /* 底部菜单 */
  .bar { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; gap:12px; padding:16px; opacity:0; transition:opacity .4s ease; pointer-events:none; z-index:20; }
  .bar.show { opacity:1; pointer-events:auto; }
  .bar button { background:rgba(127,127,127,.16); color:var(--fg); border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:9px 16px; font-size:13px; font-family:inherit; cursor:pointer; backdrop-filter:blur(6px); }
  .bar button:active { background:rgba(127,127,127,.3); }

  /* 编辑面板 */
  .editor { position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); display:none; flex-direction:column; z-index:30; }
  .editor.show { display:flex; }
  .editor-box { width:min(720px,92vw); max-height:82vh; margin:auto; background:var(--bg); border:1px solid var(--line); border-radius:18px; display:flex; flex-direction:column; overflow:hidden; }
  .editor-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); }
  .editor-head .t { font-size:16px; letter-spacing:.1em; }
  .editor-head button { background:var(--acc); color:#fff; border:none; border-radius:8px; padding:8px 18px; font-size:14px; font-family:inherit; cursor:pointer; }
  .editor-body { padding:16px 20px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .editor-body section { margin-bottom:20px; }
  .editor-body h3 { font-size:14px; color:var(--dim); letter-spacing:.1em; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
  .editor-body .add { color:var(--acc); cursor:pointer; font-weight:500; }
  .erow { display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .erow .grow { flex:1; }
  .erow .del { color:var(--dim); cursor:pointer; padding:2px 8px; }
  .erow .del:active { color:var(--acc); }
  .erow .edit { color:var(--acc); cursor:pointer; padding:2px 8px; }
  .erow .tag { flex:none; font-size:12px; color:var(--acc); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:2px 8px; }
  .weekpick { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .weekpick span { width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:var(--dim); }
  .weekpick span.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .addrow { display:flex; gap:8px; margin-top:10px; }
  .addrow select,.addrow input { background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:9px 10px; font-size:14px; font-family:inherit; }
  .addrow select { flex:none; }
  .addrow input[type=text] { flex:1; }
  .addrow input[type=time] { flex:none; color-scheme:dark; }
  .addrow input[type=date] { flex:none; color-scheme:dark; }
  .addrow button { background:var(--acc); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:14px; font-family:inherit; cursor:pointer; flex:none; }
  .editor .todo .box { cursor:pointer; }
  .editor .todo .n { cursor:pointer; }

  @media (orientation: portrait) {
    .main { flex-direction:column; }
    .left { width:100%; flex:1.1; padding:4vh 6vw 2vh; gap:2.4vh; }
    .right { width:100%; flex:1; flex-direction:row; padding:1vh 6vw 4vh; gap:3vw; }
    .time .hm { font-size:clamp(64px,31vw,260px); }
    .time .sec { font-size:clamp(22px,11vw,86px); }
    .date { font-size:clamp(13px,5vw,34px); }
    .card { padding:2vh 4vw; }

  /* 数据导入导出 */
  .drow { display:flex; gap:8px; margin-top:6px; }
  .dbtn { flex:1; background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:11px 8px; font-size:14px; font-family:inherit; cursor:pointer; }
  .dbtn:active { background:var(--acc); color:#fff; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); display:none; z-index:40; }
  .modal.show { display:flex; }
  .modal-box { width:min(560px,92vw); max-height:82vh; overflow-y:auto; margin:auto; background:var(--bg); border:1px solid var(--line); border-radius:18px; padding:18px; }
  .modal-box h4 { font-size:15px; letter-spacing:.06em; margin-bottom:12px; font-weight:500; }
  .modal-box textarea { width:100%; min-height:96px; background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:10px; font-size:14px; font-family:inherit; resize:vertical; }
  .qrwrap { display:flex; justify-content:center; margin:8px 0 14px; }
  .toast { position:fixed; left:50%; bottom:14vh; transform:translateX(-50%); background:var(--acc); color:#fff; padding:10px 22px; border-radius:22px; font-size:14px; opacity:0; transition:opacity .3s ease; z-index:70; pointer-events:none; }
  .toast.show { opacity:1; }
  .birthday { display:none; align-items:center; gap:10px; font-size:clamp(14px,4vmin,30px); font-weight:500; padding:1.2vh 1.6vw; border-radius:12px; background:rgba(239,159,39,.16); border:1px solid rgba(239,159,39,.4); color:#FAC775; }
  .birthday.show { display:flex; }
  .weather { flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:16px; padding:0 4px; }
  .w-icon { font-size:clamp(34px,8vmin,66px); line-height:1; }
  .w-info { display:flex; flex-direction:column; }
  .w-temp { font-size:clamp(26px,7vmin,54px); font-weight:500; font-variant-numeric:tabular-nums; }
  .w-sub { font-size:clamp(13px,3.2vmin,22px); color:var(--dim); margin-top:.2vh; }
</style>

  function parseBirthday(line){
    var idx = line.search(/[\s\u3000]+/); if(idx<0) return null;
    var name = line.slice(0,idx).trim();
    var dateStr = line.slice(idx).trim();
    if(!name || !dateStr) return null;
    var type='solar', month=0, day=0, m;
    if((m=dateStr.match(/^农历\s*(\d{1,2})月(\d{1,2})/))){ type='lunar'; month=+m[1]; day=+m[2]; }
    else if((m=dateStr.match(/^(\d{4})[-/年]\s*(\d{1,2})[-/月]\s*(\d{1,2})/))){ month=+m[2]; day=+m[3]; }
    else if((m=dateStr.match(/^(\d{1,2})月(\d{1,2})/))){ month=+m[1]; day=+m[2]; }
    else if((m=dateStr.match(/^(\d{1,2})[-/.](\d{1,2})/))){ month=+m[1]; day=+m[2]; }
    if(!month || !day) return null;
    if(month<1 || month>12 || day<1 || day>31) return null;
    return { name:name, type:type, month:month, day:day };
  }

        if(!d || !d.current) return;
        var code=d.current.weather_code||0; var m=WMO[code]||['未知','🌡️'];
        var t=Math.round(d.current.temperature_2m);
        var hi=d.daily?Math.round(d.daily.temperature_2m_max[0]):null;
        var lo=d.daily?Math.round(d.daily.temperature_2m_min[0]):null;
        if($('wIcon')) $('wIcon').textContent=m[1];
        if($('wTemp')) $('wTemp').textContent=t+'°';
        if($('wSub')) $('wSub').textContent=m[0]+(hi!=null?('  '+lo+'°~'+hi+'°'):'')+(d.current.wind_speed_10m!=null?('  风'+Math.round(d.current.wind_speed_10m)+'km/h'):'');
        if($('wCity')) $('wCity').textContent=CITY;
        sSet('weatherCache', JSON.stringify({t:t,code:code,hi:hi,lo:lo,wind:d.current.wind_speed_10m,ts:Date.now()}));
        renderTip();
      }).catch(function(e){ showCachedWeather(); });
    } catch(e){ showCachedWeather(); }
  }
  function renderTip(){
    var parts=[];
    try {
      var c=JSON.parse(sGet('weatherCache')||'null');
      if(c){
        var m=WMO[c.code]||['未知','🌡️']; var desc=m[0];
        if(c.lo!=null && c.lo<=15) parts.push('广州今天凉飕飕的，记得披件外套呀');
        else if(c.hi!=null && c.hi>=33) parts.push('今天热得冒汗，多喝点水哦');
        else if([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].indexOf(c.code)>=0) parts.push('外面'+desc+'呢，出门带把伞吧');
        else parts.push('今天'+desc+'，天气还挺舒服的');
        if(c.wind!=null && c.wind>=30) parts.push('风有点大，别被吹乱了头发');
      } else { parts.push('天气还在加载中呢'); }
    } catch(e){ parts.push('天气先放一边'); }
    var wd=new Date().getDay();
    if(wd===0) parts.push('周日啦，好好休息一下吧');
    else if(wd===1) parts.push('新的一周又开始咯，慢慢来');
    else if(wd===5) parts.push('周五咯，再撑一下就解放啦');
    else if(wd===6) parts.push('周六，想好去哪玩了没');
    try { var bl=birthdaysToday(); if(bl&&bl.length) parts.push('悄悄告诉你，今天是 '+bl.map(function(b){return b.name;}).join('、')+' 的生日哦'); } catch(e){}
    var txt=parts.join('。');
    if(!txt) txt='今天也要元气满满呀';
    txt += '～';
    var e=$('tipTxt'); if(e) e.textContent=txt;
  }
  function tryCloudTip(){
    try {
      fetch('tip.json?_='+Date.now()).then(function(r){ return r&&r.ok? r.json(): null; }).then(function(d){
        if(d&&d.date===fmtDate(new Date())&&d.tip){ var e=$('tipTxt'); if(e) e.textContent=d.tip; }
      }).catch(function(e){});
    } catch(e){}
  }
  showCachedWeather();
  fetchWeather();
  tryCloudTip();
  setInterval(fetchWeather, 30*60*1000);

  applyTheme(0);
  var lastDayKey = fmtDate(new Date());
  renderAll();
  setInterval(function(){
    renderTime();
    var k = fmtDate(new Date());
    if(k !== lastDayKey){ lastDayKey = k; renderAll(); tryCloudTip(); }
  }, 250);
  requestWake();
})();
</script>
<script>
(function(){
  var el = document.getElementById('hm');
  if(!el) return;
  var t=null;
  function arm(){ t=setTimeout(function(){ try{ if(window.DashBridge) window.DashBridge.openSettings(); }catch(e){} }, 1200); }
  function disarm(){ clearTimeout(t); }
  el.addEventListener('touchstart', arm);
  ['touchend','touchmove','touchcancel'].forEach(function(e){ el.addEventListener(e, disarm); });
  el.addEventListener('mousedown', arm);
  el.addEventListener('mouseup', disarm);
})();
</script>
</body>
